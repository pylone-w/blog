  <div class="comments" id="comments">
    <button type="button" class="comments-toggle" id="comments-toggle">评论</button>
    <div id="comments-host"></div>
  </div>
  <script>
  (function () {
    var wrap = document.getElementById('comments');
    var host = document.getElementById('comments-host');
    var btn  = document.getElementById('comments-toggle');
    if (!wrap || !host || !btn) return;

    var isOpen = false;
    var autoArmed = true;   

    function open() {
      if (isOpen) return;
      isOpen = true;
      host.innerHTML = '';
      var s = document.createElement('script');
      s.src = 'https://utteranc.es/client.js';
      s.setAttribute('repo', 'pylone-w/blog');
      s.setAttribute('issue-term', 'title');
      s.setAttribute('theme', 'github-light');
      s.setAttribute('crossorigin', 'anonymous');
      s.async = true;
      host.appendChild(s);
      btn.textContent = '收起评论';
      wrap.className = 'comments is-open';
    }

    function close() {
      if (!isOpen) return;
      isOpen = false;
      host.innerHTML = '';   
      btn.textContent = '评论';
      wrap.className = 'comments';
    }

    btn.addEventListener('click', function () {
      if (isOpen) { autoArmed = false; close(); }
      else { open(); }
    });

    if ('IntersectionObserver' in window) {
      var io = new IntersectionObserver(function (es) {
        if (es[0].isIntersecting) {
          io.disconnect();
          if (autoArmed) open();
        }
      }, { rootMargin: '150px' });
      io.observe(wrap);
    }
  })();
  </script>
